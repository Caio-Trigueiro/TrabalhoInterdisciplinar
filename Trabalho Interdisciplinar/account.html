<!DOCTYPE html>
<html lang="ptbr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marmitex da Jô</title>
    <link rel="stylesheet" href="style.css">
    
<link rel="icon" type="image/png" href="img/Marmitex da Jô.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body class="account-html">
    <div class="icon-log">
    <img src="img/Marmitex da Jô.png" alt="">
</div>
    <section class="conta">
<h1>Criar Conta</h1>
<p>Nome de usuario</p>
<input type="name" id="name-acc" placeholder="nome">
        <p>Registre um e-mail ou telefone</p> 
<input type="email" id="email-acc" placeholder="e-mail">
<p>Crie uma senha</p>
<input type="password" id="pass-acc" placeholder="senha">
<p>Registre seu CPF</p>
<input type="text" id="cpf-acc" placeholder="000.000.000-00">
<p>Registre seu CEP</p>
<input type="text" id="cep-acc" placeholder="00000-000">

<button onclick="salvarNoJson()" class="btn btn-conta-log">Registrar conta</button>
<p>ou</p>
<button class="btn btn-google">Continuar com o Google</button>
    </section>

    <script src="cadastro.js"></script>
</body>
</html>
